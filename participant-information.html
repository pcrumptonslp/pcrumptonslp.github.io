<title>Current Work — Phoebe Crumpton</title>
  <link rel="stylesheet" href="style.css" />
  <script>if(localStorage.getItem('lang-mode')==='simple')document.documentElement.classList.add('simple-mode');</script>
  <style>

    .page-subtitle { max-width: 100%; }

    /* ── INTRO CALLOUT ── */
    .participant-intro {
      background: var(--green-mist);
      border: 1px solid var(--green-pale);
      border-radius: var(--radius-md);
      padding: 2rem 2.5rem;
      margin-bottom: 3rem;
    }
    .participant-intro p {
      font-size: 1rem;
      color: var(--text-mid);
      line-height: 1.8;
    }
    .participant-intro p + p { margin-top: 0.75rem; }

    /* ── STUDIES LIST ── */
    .studies-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .study-card {
      background: var(--white);
      border: 1px solid var(--green-pale);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .study-card-header {
      padding: 1.6rem 2rem 1.2rem;
      border-bottom: 1px solid var(--green-mist);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .study-status-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .study-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--green-deep);
      line-height: 1.35;
    }

    .study-body {
      display: grid;
      grid-template-columns: 400px 1fr;
      grid-template-rows: 1fr auto;
      gap: 1.2rem 2rem;
      padding: 1.5rem 2rem;
    }

    .study-desc {
      font-size: 0.93rem;
      color: var(--text-mid);
      line-height: 1.7;
      grid-column: 2;
      grid-row: 1;
    }

    /* Flyer thumbnail */
    .study-flyer {
      grid-column: 1;
      grid-row: 1 / 3;
      width: 100%;
      border: 1px solid var(--green-pale);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .study-flyer:hover { box-shadow: var(--shadow-md); }
    .study-flyer img {
      width: 100%;
      display: block;
    }
    .study-flyer-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-light);
      text-align: center;
      padding: 0.4rem;
      background: var(--sand);
    }

    .study-actions {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      align-self: end;
      padding-top: 0.5rem;
      border-top: 1px solid var(--green-mist);
    }

    /* Complete studies look slightly muted */
    .study-card.complete {
      opacity: 0.82;
    }
    .study-card.complete .study-title {
      color: var(--text-mid);
    }

    .study-body.no-flyer { grid-template-columns: 1fr; }
    .study-body.no-flyer .study-desc,
    .study-body.no-flyer .study-actions { grid-column: 1; }

    /* ── ETHICS NOTE ── */
    .ethics-note {
      margin-top: 3rem;
      padding: 1.5rem 2rem;
      border-left: 3px solid var(--green-light);
      background: var(--green-mist);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .ethics-note p {
      font-size: 0.9rem;
      color: var(--text-mid);
      line-height: 1.7;
    }
    .ethics-note p + p { margin-top: 0.5rem; }

    @media (max-width: 860px) {
      .study-body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .study-flyer { grid-column: 1; grid-row: 1; width: 100%; max-width: 400px; }
      .study-desc { grid-column: 1; grid-row: 2; align-self: start; }
      .study-actions { grid-column: 1; grid-row: 3; align-self: start; }
      .study-card-header { flex-direction: column; }
      .participant-intro { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const menu   = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.site-nav')) {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', false);
      }
    });
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver(entries => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 70);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    reveals.forEach(el => io.observe(el));
  </script>

  <style>
    /* Visually hidden utility for screen-reader-only text */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
