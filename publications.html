<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Publications by Phoebe Crumpton." />
<title>Publications — Phoebe Crumpton</title>
  <link rel="stylesheet" href="style.css" />
  <script>if(localStorage.getItem('lang-mode')==='simple')document.documentElement.classList.add('simple-mode');</script>
  <style>
    .pub-list { display: flex; flex-direction: column; gap: 0; }

    .pub-item {
      display: grid;
      grid-template-columns: 3.5rem 1fr;
      gap: 1.5rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--green-pale);
      align-items: start;
    }
    .pub-item:first-of-type { border-top: 1px solid var(--green-pale); }

    .pub-year {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--amber);
      padding-top: 0.25rem;
      letter-spacing: 0.04em;
    }

    .pub-content {}

    .pub-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--green-deep);
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .pub-title a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--green-pale);
      transition: border-color 0.18s, color 0.18s;
    }
    .pub-title a:hover {
      color: var(--green-rich);
      border-color: var(--green-mid);
    }

    .pub-authors {
      font-size: 0.88rem;
      color: var(--text-light);
      margin-bottom: 0.25rem;
    }
    .pub-authors strong {
      color: var(--text-mid);
      font-weight: 500;
    }

    .pub-venue {
      font-size: 0.88rem;
      color: var(--text-mid);
      font-style: italic;
      margin-bottom: 0.6rem;
    }

    .pub-abstract {
      font-size: 0.88rem;
      color: var(--text-light);
      line-height: 1.65;
      margin-bottom: 0.8rem;
    }

    .pub-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .pub-link {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--green-rich);
      text-decoration: none;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--green-pale);
      border-radius: 2px;
      background: var(--white);
      transition: all 0.18s;
    }
    .pub-link:hover {
      background: var(--green-mist);
      border-color: var(--green-mid);
      color: var(--green-deep);
    }

    .pub-section-heading {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--green-deep);
      margin-bottom: 0.25rem;
    }

    .pub-section-intro {
      font-size: 0.88rem;
      color: var(--text-light);
      margin-bottom: 1.5rem;
    }

    .pub-section + .pub-section {
      margin-top: 3.5rem;
    }

    .page-subtitle { max-width: none; }

    .scholar-btn-wrap {
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>

<a href="index.html" class="nav-home" aria-label="Phoebe Crumpton — Home">Phoebe Crumpton</a>    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">☰</button>

      <li><a href="index.html">About</a></li>

<li><a href="participant-information.html">Current Work</a></li>    </ul>
    <button id="lang-toggle" class="lang-toggle-btn" role="switch" aria-checked="false" aria-label="Toggle between simple and detailed language">
      <span class="lang-toggle-label lang-toggle-simple">Simple</span>
      <span class="lang-toggle-track"><span class="lang-toggle-thumb"></span></span>
      <span class="lang-toggle-label lang-toggle-detailed">Detailed</span>
    </button>
  </nav>

    <div class="page-wrapper">

</header>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const menu   = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.site-nav')) {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', false);
      }
    });
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver(entries => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 60);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    reveals.forEach(el => io.observe(el));
  </script>

<script src="scripts/cursor-tip.js"></script>
<script src="scripts/lang-toggle.js"></script>
</body>
