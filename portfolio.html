<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Research portfolio of Phoebe Crumpton." />
<title>Portfolio — Phoebe Crumpton</title>
  <link rel="stylesheet" href="style.css" />
  <script>if(localStorage.getItem('lang-mode')==='simple')document.documentElement.classList.add('simple-mode');</script>
  <style>
    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .page-subtitle { max-width: 100%; }

    .project-card {
      background: var(--white);
      border: 1px solid var(--green-pale);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s, box-shadow 0.22s;
      position: relative;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .project-card:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    /* Accent bar */
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, var(--green-mid), var(--green-light));
      opacity: 0;
      transition: opacity 0.22s;
    }
    .project-card:hover::before { opacity: 1; }

    .project-img-wrap {
      height: 180px;
      overflow: hidden;
      background: var(--green-mist);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.4s ease;
    }
    .project-card:hover .project-img-wrap img {
      transform: scale(1.04);
    }

    .project-body {
      padding: 1.4rem 1.5rem 1.6rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.7rem;
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 500;
      color: var(--green-deep);
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }

    .project-desc {
      font-size: 0.87rem;
      color: var(--text-light);
      line-height: 1.65;
      flex: 1;
    }

    .project-cta {
      margin-top: 1rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green-rich);
    }

    .project-img-placeholder {
      height: 180px;
      background: var(--green-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--green-light);
    }

    .portfolio-section + .portfolio-section {
      margin-top: 3rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--green-pale);
    }

    .portfolio-section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 0.35rem;
    }

    .portfolio-section-heading {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--green-deep);
      margin-bottom: 1.5rem;
    }

    .poster-flyer {
      display: block;
      border: 1px solid var(--green-pale);
      border-radius: var(--radius-sm);
      overflow: hidden;
      text-decoration: none;
      transition: box-shadow 0.2s;
    }
    .poster-flyer:hover { box-shadow: var(--shadow-md); }
    .poster-flyer img { width: 100%; display: block; }
    .poster-flyer-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-light);
      text-align: center;
      padding: 0.4rem;
      background: var(--sand);
    }

    @media (max-width: 680px) {
      .portfolio-grid { grid-template-columns: 1fr; }
      .poster-flyer { max-width: 100%; }
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="site-nav" aria-label="Main navigation">
<a href="index.html" class="nav-home" aria-label="Phoebe Crumpton — Home">Phoebe Crumpton</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">☰</button>
    <ul class="nav-links" id="nav-menu" role="list">
      <li><a href="index.html">About</a></li>
      <li><a href="publications.html">Publications</a></li>
      <li><a href="portfolio.html" aria-current="page">Portfolio</a></li>
      <li><a href="cv.html">CV</a></li>
<li><a href="participant-information.html">Current Work</a></li>
    </ul>
    <button id="lang-toggle" class="lang-toggle-btn" role="switch" aria-checked="false" aria-label="Toggle between simple and detailed language">
      <span class="lang-toggle-label lang-toggle-simple">Simple</span>
      <span class="lang-toggle-track"><span class="lang-toggle-thumb"></span></span>
      <span class="lang-toggle-label lang-toggle-detailed">Detailed</span>
    </button>
  </nav>

  <main id="main-content">
    <div class="page-wrapper">

    <header class="page-header reveal">
  <p class="page-eyebrow">Research Projects</p>
  <h1 class="page-title">Portfolio</h1>
  <p class="page-subtitle">Coming soon.</p>
</header>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
<div class="footer-name">Phoebe Crumpton</div>
<div class="footer-sub">Speech-Language Pathologist · PhD Student · UW-Madison</div>
      </div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="index.html">About</a>
        <a href="publications.html">Publications</a>
        <a href="portfolio.html">Portfolio</a>

<a href="participant-information.html">Current Work</a>

<div class="footer-copy">© 2026 Phoebe Crumpton</div>

  </footer>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const menu   = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.site-nav')) {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', false);
      }
    });
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver(entries => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    reveals.forEach(el => io.observe(el));
  </script>

<script src="scripts/cursor-tip.js"></script>
<script src="scripts/lang-toggle.js"></script>
</body>
</html>
